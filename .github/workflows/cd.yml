name: Deepiri CD - deepiri-auth-service

# Keeps deepiri-platform's pinned commit for this service up to date.
#
# This repo is NOT part of a monorepo. It stays a standalone repository with its
# own history and CI. deepiri-platform tracks it as a git submodule -- a single
# pinned commit SHA. Production deploys run from deepiri-platform's own CD
# (.github/workflows/cd-cloud-portal.yml), which builds each submodule with
# docker compose on the VPS. Until now someone bumped that pinned SHA by hand
# after every merge (see the many `chore/bump-*` branches). This workflow does
# that one-line bump automatically: on push to `main` it repoints
# deepiri-platform at the new commit, which triggers the platform deploy.
#
# ---------------------------------------------------------------------------
# Required repo secrets (Settings > Secrets and variables > Actions)
# ---------------------------------------------------------------------------
# Auth is a GitHub App owned by the Team-Deepiri org, so it is not tied to any
# person's account and its key does not expire. Create the App once (Org >
# Settings > Developer settings > GitHub Apps), give it "Contents: Read and
# write" AND "Pull requests: Read and write", install it on the org limited
# to `deepiri-platform`, then set:
#
#   PLATFORM_BUMP_APP_ID   - the App's numeric App ID
#   PLATFORM_BUMP_APP_KEY  - the App's private key, the full contents of the
#                            downloaded .pem file (BEGIN/END lines included)
#
# Set the same two secrets in every service repo that has this workflow, or
# add them once as an org-level Actions secret scoped to those repos.
# ---------------------------------------------------------------------------
#
# PUSH_MODE below controls the behaviour:
#   pr     - open a PR against platform `main`; a human merges it to deploy.
#            This is the working mode for this org. Needs the App to also carry
#            "Pull requests: Read and write".
#   direct - push straight to platform `main`. Does NOT work here -- platform
#            `main` has a ruleset requiring every change to go through a PR.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bump-platform-submodule
  cancel-in-progress: false

env:
  PLATFORM_REPO: Team-Deepiri/deepiri-platform
  PLATFORM_OWNER: Team-Deepiri
  PLATFORM_BRANCH: main
  SUBMODULE_PATH: platform-services/backend/deepiri-auth-service
  PUSH_MODE: pr

jobs:
  bump:
    name: Bump platform submodule
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check App credentials are present
        env:
          APP_ID: ${{ secrets.PLATFORM_BUMP_APP_ID }}
          APP_KEY: ${{ secrets.PLATFORM_BUMP_APP_KEY }}
        run: |
          missing=
          [ -n "$APP_ID" ]  || missing="$missing PLATFORM_BUMP_APP_ID"
          [ -n "$APP_KEY" ] || missing="$missing PLATFORM_BUMP_APP_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secret(s):$missing -- add them in Settings > Secrets and variables > Actions (see this file's header)."
            exit 1
          fi

      - name: Mint a short-lived token for deepiri-platform
        id: apptoken
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PLATFORM_BUMP_APP_ID }}
          private-key: ${{ secrets.PLATFORM_BUMP_APP_KEY }}
          owner: ${{ env.PLATFORM_OWNER }}
          repositories: deepiri-platform

      - name: Checkout deepiri-platform
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PLATFORM_REPO }}
          ref: ${{ env.PLATFORM_BRANCH }}
          token: ${{ steps.apptoken.outputs.token }}
          fetch-depth: 0
          path: platform

      - name: Compare pinned commit
        id: bump
        working-directory: platform
        run: |
          set -euo pipefail
          NEW_SHA="${{ github.sha }}"
          CURRENT_SHA="$(git ls-tree HEAD "$SUBMODULE_PATH" | awk '{print $3}')"
          echo "submodule path : $SUBMODULE_PATH"
          echo "current pinned : ${CURRENT_SHA:-<none>}"
          echo "new commit     : $NEW_SHA"
          if [ -z "$CURRENT_SHA" ]; then
            echo "::error::$SUBMODULE_PATH is not a submodule in $PLATFORM_REPO@$PLATFORM_BRANCH"
            exit 1
          fi
          if [ "$CURRENT_SHA" = "$NEW_SHA" ]; then
            echo "Already up to date -- nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push bump to platform main
        if: steps.bump.outputs.changed == 'true' && env.PUSH_MODE == 'direct'
        working-directory: platform
        run: |
          set -euo pipefail
          NEW_SHA="${{ github.sha }}"
          SHORT="${NEW_SHA:0:12}"
          SERVICE="${GITHUB_REPOSITORY##*/}"
          git config user.name  "deepiri-ci[bot]"
          git config user.email "deepiri-ci[bot]@users.noreply.github.com"
          MSG="chore(submodule): bump ${SERVICE} to ${SHORT}

          Auto-bump from ${GITHUB_REPOSITORY}@${NEW_SHA}
          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # Retry loop: another service merging at the same time can land its own
          # bump first and make our push non-fast-forward. Re-sync and re-apply.
          for attempt in 1 2 3 4 5; do
            git fetch origin "$PLATFORM_BRANCH"
            git reset --hard "origin/$PLATFORM_BRANCH"
            git update-index --cacheinfo 160000,"$NEW_SHA","$SUBMODULE_PATH"
            if git diff --cached --quiet; then
              echo "Someone already bumped to $SHORT. Done."
              exit 0
            fi
            git commit -m "$MSG"
            if git push origin "HEAD:$PLATFORM_BRANCH"; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) -- resyncing and retrying."
            sleep $((attempt * 3))
          done
          echo "::error::Could not push submodule bump after 5 attempts."
          exit 1

      - name: Open PR against platform
        if: steps.bump.outputs.changed == 'true' && env.PUSH_MODE == 'pr'
        working-directory: platform
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
        run: |
          set -euo pipefail
          NEW_SHA="${{ github.sha }}"
          SHORT="${NEW_SHA:0:12}"
          SERVICE="${GITHUB_REPOSITORY##*/}"
          BRANCH="auto-bump/${SERVICE}-${SHORT}"
          git config user.name  "deepiri-ci[bot]"
          git config user.email "deepiri-ci[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git update-index --cacheinfo 160000,"$NEW_SHA","$SUBMODULE_PATH"
          git commit -m "chore(submodule): bump ${SERVICE} to ${SHORT}"
          git push -f origin "$BRANCH"
          # Reuse the bump PR for this branch only while it is still OPEN -- a
          # closed or merged one must not suppress a fresh deploy PR. A genuine
          # failure (e.g. the App lacks "Pull requests: write") ends with no open
          # PR and fails the job loudly; a PR that appears between the check and
          # the create (concurrent run) is tolerated.
          pr_state="$(gh pr view "$BRANCH" --repo "$PLATFORM_REPO" --json state --jq .state 2>/dev/null || true)"
          if [ "$pr_state" = "OPEN" ]; then
            echo "PR already open for $BRANCH; force-pushed the updated bump onto it."
          elif gh pr create --repo "$PLATFORM_REPO" --base "$PLATFORM_BRANCH" --head "$BRANCH" \
                 --title "chore(submodule): bump ${SERVICE} to ${SHORT}" \
                 --body "Auto-generated from ${GITHUB_REPOSITORY}@${NEW_SHA}. Merging this deploys the platform."; then
            echo "Opened PR for $BRANCH."
          elif [ "$(gh pr view "$BRANCH" --repo "$PLATFORM_REPO" --json state --jq .state 2>/dev/null || true)" = "OPEN" ]; then
            echo "A PR for $BRANCH was opened concurrently; nothing to do."
          else
            echo "::error::gh pr create failed and no open PR exists for $BRANCH (App missing 'Pull requests: write'?)"
            exit 1
          fi
